services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exceptions
      POSTGRES_PASSWORD: exceptions
      POSTGRES_DB: exceptions
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exceptions"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://exceptions:exceptions@db:5432/exceptions
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_ON_STARTUP: "true"
      AI_PROVIDER: offline
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./backend:/srv"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
